name: Auto Deploy SoruPilot

on:
  push:
    branches:
      - sorupilot
    paths:
      - 'webapp/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'webapp'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    runs-on: ubuntu-latest
    needs: deploy-pages
    if: always()
    steps:
      - name: Deploy successful
        if: needs.deploy-pages.result == 'success'
        run: echo "✅ SoruPilot deployed to vekil.siyahkare.com"

      - name: Deploy failed
        if: needs.deploy-pages.result == 'failure'
        run: echo "❌ Deployment failed - check logs"
