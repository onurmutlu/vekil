# Google Cloud Build config for SoruPilot backend
# Deploy to Cloud Run

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sorupilot:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sorupilot:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sorupilot:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - --filename=.
      - --image=gcr.io/$PROJECT_ID/sorupilot:$SHORT_SHA
      - --location=us-central1
      - --filename=deploy/

images:
  - 'gcr.io/$PROJECT_ID/sorupilot:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/sorupilot:latest'

options:
  machineType: 'N1_HIGHCPU_8'

timeout: '1800s'
